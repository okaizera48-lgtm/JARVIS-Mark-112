name: Build JARVIS Mark 112

on:
  workflow_dispatch:
  push:
    paths:
      - 'Mark112_JARVIS_Fabric_1.21.11_SOURCE.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract source
        run: unzip -q Mark112_JARVIS_Fabric_1.21.11_SOURCE.zip -d source

      - name: Inspect project files
        run: find source -maxdepth 3 -type f | head -100
        
