name: Build JARVIS Mark 112

on:
  workflow_dispatch:
  push:
    paths:
      - 'Mark112_JARVIS_Fabric_1.21.11_SOURCE.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source
        run: |
          unzip -q Mark112_JARVIS_Fabric_1.21.11_SOURCE.zip -d source
          test -f source/Mark112_Nanotech/build.gradle

      - name: Set up Gradle 9.2.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Build mod
        working-directory: source/Mark112_Nanotech
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Mark-112
          path: source/Mark112_Nanotech/build/libs/*.jar
          if-no-files-found: error
          
